<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloomday | Dashboard</title>
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/normalize.css" />
</head>
<body>
  <header class="header">
    <div class="decorative-circles"></div>
    <div class="decorative-circles"></div>
    <div class="header-content">
      <div class="logo">Bloomday</div>
      <div class="user-area">
        <div class="notifications">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="notification-badge">3</span>
        </div>
        <div class="avatar">
          <img src="images/profile.jpg" alt="User memoji" class="memoji">
        </div>
      </div>
    </div>
    <div class="floating-element floating-confetti-1">🌟</div>
    <div class="floating-element floating-confetti-2">🎉</div>
    <div class="floating-element floating-confetti-3">✨</div>
  </header>

  <main class="main-content">
    <section class="welcome-section">
      <div class="welcome-text">
        <h1>Hey, Jessica! 👋</h1>
        <p>Ready to plan something amazing?</p>
      </div>
      <button class="create-btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        Create Event
      </button>
    </section>

    <div class="tabs">
      <div class="tab active">Upcoming</div>
      <div class="tab">Past</div>
      <div class="tab">Invitations</div>
    </div>

    <section>
      <h2 class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        Your Events
      </h2>
      <div class="events-grid">
        <!-- Event 1 -->
        <div class="event-card" style="animation-delay: 0.1s;">
          <div class="event-img" style="background: linear-gradient(45deg, #8A2387, #E94057, #F27121);">
            <div class="event-decoration"></div>
            <div class="event-theme-icon">🥂</div>
            <div class="event-theme-tag">Wedding</div>
            <div class="event-date">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              May 15, 2025
            </div>
          </div>
          <div class="event-content">
            <h3 class="event-title">John & Sarah's Wedding</h3>
            <div class="event-details">
              <span>6:00 PM</span>
              <span>Grand Plaza Hotel</span>
            </div>
            <div class="event-attendees">
              <div class="attendee">JD</div>
              <div class="attendee">KM</div>
              <div class="attendee">AL</div>
              <div class="attendee-count">+42</div>
            </div>
            <div class="event-actions">
              <button class="event-btn primary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Invite
              </button>
              <button class="event-btn secondary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
                Edit
              </button>
            </div>
          </div>
        </div>
        
        <!-- Event 2 -->
        <div class="event-card" style="animation-delay: 0.2s;">
          <div class="event-img" style="background: linear-gradient(45deg, #00C6FF, #0072FF);">
            <div class="event-decoration"></div>
            <div class="event-theme-icon">🎂</div>
            <div class="event-theme-tag">Birthday</div>
            <div class="event-date">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              April 22, 2025
            </div>
          </div>
          <div class="event-content">
            <h3 class="event-title">Mike's 30th Birthday</h3>
            <div class="event-details">
              <span>8:00 PM</span>
              <span>Rooftop Lounge</span>
            </div>
            <div class="event-attendees">
              <div class="attendee">RK</div>
              <div class="attendee">TS</div>
              <div class="attendee-count">+16</div>
            </div>
            <div class="event-actions">
              <button class="event-btn primary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Invite
              </button>
              <button class="event-btn secondary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232
